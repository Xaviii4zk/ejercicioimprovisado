<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    
    header {
        height: 100px;
        background-color: brown;
        color: white;
    }

    main {
        background-color: aliceblue;
        height: calc(100vh - 150px);
    }

    footer {
        height: 50px;
        background-color: brown;
    }

    .bola {
        width: 50px;
        height: 50px;
        background-color: red;
        border-radius: 50%;
        position: absolute;
        top: 0;
        left: 0;
    }

    .tablero {
        position: relative;
    }

</style>
</head>
<body>
    <header> 
        <h1>Bola en tablero</h1>

    </header>
    <main class="tablero">
        <div class="bola">

        </div>
    </main>
    <footer>
        <button>Parar</button>
    </footer>
    <script>
        const bola = {
            posX: 0,
            posY: 0,
            veloX: 5,
            veloY: 5,
        }
        
        const divTablero = document.querySelector(".tablero");
        const divBola = document.querySelector(".bola");
        console.log(divBola);

        const timer = setInterval(() => {
            bola.posX = bola.posX + bola.veloX
            console.log(bola.posX)
            divBola.style.left = bola.posX + "px";
            if (bola.posX > divTablero.offsetWidth - 50) bola.veloX = bola.veloX * -1
            if (bola.posX < 1) bola.veloX = bola.veloX * -1

            bola.posY = bola.posY + bola.veloY
            console.log(bola.posY)
            divBola.style.top = bola.posY + "px";
            if (bola.posY > divTablero.offsetHeight - 51) bola.veloY = bola.veloY * -1
            if (bola.posY < 1) bola.veloY = bola.veloY * -1
        }, 50)
        document.querySelector("button").addEventListener('click', () => {
            clearInterval(timer)
        })
    </script>
</body>
</html>
